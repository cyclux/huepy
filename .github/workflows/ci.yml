name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run basedpyright

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Verify the wheel imports and ships its typing marker
        run: |
          uv run --no-project --isolated --with dist/*.whl python -c "
          import huepy, importlib.util, pathlib
          root = pathlib.Path(importlib.util.find_spec('huepy').origin).parent
          assert (root / 'py.typed').is_file(), 'py.typed missing from the wheel'
          print('huepy', huepy.__all__)
          "
